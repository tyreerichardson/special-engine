name: Cross-Platform Boost WebSocket Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    env:
      BOOST_VERSION: 1.78.0
      BOOST_VERSION_UNDERSCORE: 1_78_0
      BOOST_ROOT: ${{ github.workspace }}/boost

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: 🧰 Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt install unzip

    - name: 🧰 Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake boost

    - name: 🧰 Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

    - name: 📦 Download Boost 1.78.0
      if: matrix.os != 'macos-latest'
      run: |
        curl -L -o boost_${{ env.BOOST_VERSION_UNDERSCORE }}.zip https://archives.boost.io/release/${{ env.BOOST_VERSION }}/source/boost_${{ env.BOOST_VERSION_UNDERSCORE }}.zip
        unzip boost_${{ env.BOOST_VERSION_UNDERSCORE }}.zip
        mv boost_${{ env.BOOST_VERSION_UNDERSCORE }} boost

    - name: 🏗️ Bootstrap and Build Boost (Linux/macOS)
      if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
      working-directory: ${{ env.BOOST_ROOT }}
      run: |
        mv boost_${{ env.BOOST_VERSION_UNDERSCORE }} boost;
        cd boost
        ./bootstrap.sh --with-libraries=system,thread,json
        ./b2 link=static variant=release threading=multi runtime-link=static -j 2

    - name: 🏗️ Bootstrap and Build Boost (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: ${{ env.BOOST_ROOT }}
      run: |
        ./boost/bootstrap.bat
        ./boost/b2 install --prefix=stage --with-system --with-thread --with-json
      shell: bash

    - name: 🛫 Export environment variables
      run: |
        echo "BOOST_ROOT=${{ github.workspace }}/boost" >> $GITHUB_ENV
        echo "BOOST_INCLUDEDIR=${{ github.workspace }}/boost" >> $GITHUB_ENV
        echo "BOOST_LIBRARYDIR=${{ github.workspace }}/boost/stage/lib" >> $GITHUB_ENV
      shell: bash
      
    - name: ✅ Verify Boost libraries exist
      run: |
        echo "Checking for Boost static libraries..."
        ls boost
        ls boost/boost
        BOOST_LIB_DIR="./boost/boost/stage/lib"
        MISSING_LIBS=()

        for LIB in libboost_thread.a libboost_system.a libboost_json.a; do
          if [ ! -f "${BOOST_LIB_DIR}/${LIB}" ]; then
              echo "❌ Missing: ${LIB}"
              MISSING_LIBS+=("${LIB}")
          else
              echo "✅ Found: ${LIB}"
          fi
        done

        if [ ${#MISSING_LIBS[@]} -ne 0 ]; then
            echo "❗ Some Boost libraries are missing: ${MISSING_LIBS[@]}"
            exit 1
        else
            echo "✅ All required Boost libraries are present."
        fi
        
    - name: 🧱 Configure with CMake
      run: |
        mv boost boost_${{ env.BOOST_VERSION_UNDERSCORE }};
        cd socketserver;  
        cmake -DCMAKE_PREFIX_PATH=$BOOST_ROOT/boost -DCMAKE_BUILD_TYPE=Release .
      env: 
        Boost_NO_SYSTEM_PATHS: ON

    - name: 🏗️ Build
      run: |
        cd socketserver/
        make

    - name: 📦 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: boost-websocket-${{ runner.os }}
        path: |
          build/**/*.exe
          build/**/*.out
          build/**/*.app
